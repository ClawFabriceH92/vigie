# Workflow GitHub Actions Android — build APK + release automatique (validé monuments-nearby/network-scanner, 08/2026)
#
# - push sur main  → build assembleDebug + publication release "latest" (écrasée à chaque push)
# - tag v*         → build + release versionnée (tag_name) avec APK renommé vigie-v<version>.apk
# - workflow_dispatch → build manuel
name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish "latest" release (push on main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "vigie-v${VER}.apk"
          gh release delete latest --yes --repo "${{ github.repository }}" 2>/dev/null || true
          for i in 1 2 3 4 5; do
            if gh release create latest "vigie-v${VER}.apk" \
              --title "Latest build" \
              --notes "APK le plus récent — build automatique du push sur main." \
              --repo "${{ github.repository }}"; then
              break
            fi
            echo "Échec création release (tentative $i/5), nouvel essai dans 10 s…"
            sleep 10
          done

      - name: Publish versioned release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "vigie-v${VER}.apk"
          gh release create "$GITHUB_REF_NAME" "vigie-v${VER}.apk" \
            --title "$GITHUB_REF_NAME" \
            --notes "Build automatique — APK $GITHUB_REF_NAME." \
            --repo "${{ github.repository }}" \
            || gh release upload "$GITHUB_REF_NAME" "vigie-v${VER}.apk" \
               --clobber --repo "${{ github.repository }}"
